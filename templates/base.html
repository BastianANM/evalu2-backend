{% load static %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block titulo %}CineTerror{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <style>
      body {
        background: linear-gradient(135deg, #0b0b0f, #1b1b2d 40%, #0b0b0f);
        color: #f8f9fa;
        min-height: 100vh;
      }

      .navbar {
        background: rgba(17, 17, 24, 0.9);
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      main {
        padding: 2rem 0 4rem;
      }

      .tarjeta-genero {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.2);
      }

      .tarjeta-pelicula {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        overflow: hidden;
      }

      .tarjeta-pelicula img {
        height: 260px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'homebastian:inicio' %}">CineTerror</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'homebastian:inicio' %}">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="#terror">Terror</a></li>
            <li class="nav-item"><a class="nav-link" href="#slasher">Slasher</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  </body>
</html>
